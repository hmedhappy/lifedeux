# Use this instead of Caddy if nginx already serves other sites on the VPS.
#   sudo cp deploy/nginx-lifedeux.conf /etc/nginx/sites-available/lifedeux
#   sudo ln -s /etc/nginx/sites-available/lifedeux /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d lifedeux.afdev.site      # adds HTTPS
server {
    listen 80;
    server_name lifedeux.afdev.site;

    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
