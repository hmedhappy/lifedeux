name: CI

on:
  push:
  pull_request:

# A newer push to the same branch cancels the run still in progress (never a deployment midway).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/staging' }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lifedeux
          POSTGRES_PASSWORD: lifedeux
          POSTGRES_DB: lifedeux_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lifedeux"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://lifedeux:lifedeux@localhost:5432/lifedeux_test
      E2E_DATABASE_URL: postgresql://lifedeux:lifedeux@localhost:5432/lifedeux_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  # Merged to main and every test green: the VPS runs deploy/ci-deploy.sh (backup, then deploy.sh).
  # main -> https://medelys.tn (production), staging -> https://medelys.afdev.site
  deploy:
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      TARGET: ${{ github.ref_name == 'staging' && 'staging ' || '' }}  # '' is falsy in expressions: test staging first
      SITE: ${{ github.ref_name == 'main' && 'https://medelys.tn' || 'https://medelys.afdev.site' }}
    steps:
      - name: Deploy to the VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          HOST: ${{ secrets.VPS_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The key may only run ci-deploy.sh on the server: "<sha>" for main, "staging <sha>" for staging.
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "root@$HOST" "${TARGET}${GITHUB_SHA}"
      - name: Check the site answers
        run: curl -fsS -o /dev/null -w "%{http_code}\n" --retry 10 --retry-delay 6 --retry-all-errors "$SITE/fr"
