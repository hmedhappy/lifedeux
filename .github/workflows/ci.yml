name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lifedeux
          POSTGRES_PASSWORD: lifedeux
          POSTGRES_DB: lifedeux_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lifedeux"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://lifedeux:lifedeux@localhost:5432/lifedeux_test
      E2E_DATABASE_URL: postgresql://lifedeux:lifedeux@localhost:5432/lifedeux_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
